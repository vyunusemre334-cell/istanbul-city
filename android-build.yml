name: İstanbul City Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'native/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'native/**'
      - '*.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  native-tests:
    name: C++20 host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native tests
        run: cmake -S native -B build-native -DIV_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build native tests
        run: cmake --build build-native --parallel 2
      - name: Run CTest
        run: ctest --test-dir build-native --output-on-failure

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-city-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
