
name: Istanbul City APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını aç
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP dosyasi bulunamadi!"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          PROJECT=$(find source -name settings.gradle -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Android proje dosyasi bulunamadi!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android araçlarını yükle
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK oluştur
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: APK dosyasını hazırla
        uses: actions/upload-artifact@v4
        with:
          name: Istanbul-City-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
