plugins { id 'com.android.application' }
android {
 namespace 'com.istanbulvice.underground'
 compileSdk 35
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig {
  applicationId 'com.istanbulvice.underground'
  minSdk 26
  targetSdk 35
  versionCode 7
  versionName '1.1.0'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  externalNativeBuild { cmake { cppFlags '-std=c++20 -O3 -ffast-math -fno-exceptions -fno-rtti'; arguments '-DANDROID_STL=c++_shared' } }
 }
 externalNativeBuild { cmake { path file('../native/CMakeLists.txt'); version '3.22.1' } }
}
